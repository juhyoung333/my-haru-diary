}
if ('caches' in window) {
  caches.keys().then(names => {
    for (const n of names) { caches.delete(n); }
  });
}

  function getTodayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function formatDisplayDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    const dateObj = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
    const dows = ['일', '월', '화', '수', '목', '금', '토'];
    return `${y.slice(2)} / ${m} / ${d} (${dows[dateObj.getDay()]})`;
  }

  function calculateDuration(startTime, endTime) {
    if (!startTime || !endTime) return '';
    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    let diffMinutes = (eh * 60 + em) - (sh * 60 + sm);
    if (diffMinutes < 0) diffMinutes += 24 * 60;
    const hours = Math.floor(diffMinutes / 60);
    const mins = diffMinutes % 60;
    if (hours > 0 && mins > 0) return `${hours}h ${mins}m`;
    if (hours > 0) return `${hours}h 00m`;
    return `${mins}m`;
  }

  function formatScheduleTime(item) {
    if (!item.time && !item.endTime) return '종일';
    if (item.time && item.endTime) return `${item.time} ~ ${item.endTime}`;
    if (item.time) return `${item.time} ~`;
    return `~ ${item.endTime}`;
  }

  function sortSchedulesByTime(list) {
    return [...list].sort((a, b) => {
      const timeA = a.time || '';
      const timeB = b.time || '';
      if (timeA && timeB) {
        if (timeA !== timeB) return timeA.localeCompare(timeB);
        return (a.endTime || '').localeCompare(b.endTime || '');
      }
      if (timeA && !timeB) return -1;
      if (!timeA && timeB) return 1;
      return 0;
    });
  }

  function getWeekKey(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const cur = new Date(y, m - 1, d);
    const start = new Date(cur);
    start.setDate(cur.getDate() - cur.getDay());
    return `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast-notice');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function showConfirmDialog(title, message, isDanger = false) {
    return new Promise(resolve => {
      const modal = document.getElementById('confirm-modal');
      const titleEl = document.getElementById('confirm-modal-title');
      const msgEl = document.getElementById('confirm-modal-msg');
      const okBtn = document.getElementById('confirm-modal-ok');
      const cancelBtn = document.getElementById('confirm-modal-cancel');

      titleEl.textContent = title;
      msgEl.textContent = message;
      okBtn.className = isDanger ? 'modal-btn danger' : 'modal-btn primary';
      modal.style.display = 'flex';

      const cleanup = () => {
        modal.style.display = 'none';
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
      };
      const onOk = () => { cleanup(); resolve(true); };
      const onCancel = () => { cleanup(); resolve(false); };

      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  function sanitizeForFirestore(obj) {
    return JSON.parse(JSON.stringify(obj, (k, v) => (v === undefined ? null : v)));
  }

  class SmoothCanvas {
    constructor(canvasId) {
      this.canvas = document.getElementById(canvasId);
      this.ctx = this.canvas.getContext('2d');
      this.id = canvasId;
      this.strokes = [];
      this.currentStroke = null;
      this.isDrawing = false;
      this.defaultHeight = DEFAULT_CANVAS_HEIGHTS[canvasId] || 175;
      this.displayWidth = 320;
      this.lastPos = null;

      this.initEvents();
      this.resizeCanvas();
    }

    resizeCanvas() {
      if (!this.canvas) return;
      const rect = this.canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const parentWidth = this.canvas.parentElement ? this.canvas.parentElement.clientWidth : 0;
      const displayWidth = rect.width > 0 ? rect.width : (parentWidth > 0 ? parentWidth : 320);
      this.displayWidth = displayWidth;

      let curH = parseInt(this.canvas.style.height) || parseInt(this.canvas.getAttribute('height')) || this.defaultHeight;
      if (curH > MAX_SAFE_HEIGHT || curH < MIN_SAFE_HEIGHT) curH = this.defaultHeight;

      this.canvas.width = Math.round(displayWidth * dpr);
      this.canvas.height = Math.round(curH * dpr);
      this.canvas.style.height = `${curH}px`;
      if (this.canvas.parentElement) {
        this.canvas.parentElement.style.height = `${curH}px`;
      }

      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.ctx.scale(dpr, dpr);

      this.redrawFull();
    }

    setHeight(newHeight) {
      const clamped = Math.max(MIN_SAFE_HEIGHT, Math.min(MAX_SAFE_HEIGHT, Math.round(newHeight / 33) * 33));
      this.canvas.setAttribute('height', clamped);
      this.canvas.style.height = `${clamped}px`;
      if (this.canvas.parentElement) this.canvas.parentElement.style.height = `${clamped}px`;
      this.resizeCanvas();
    }

    initEvents() {
      this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      this.canvas.addEventListener('touchstart', (e) => {
        if (currentTool !== 'scroll') e.preventDefault();
      }, { passive: false });
      this.canvas.addEventListener('touchmove', (e) => {
        if (currentTool !== 'scroll') e.preventDefault();
      }, { passive: false });

      this.canvas.addEventListener('pointerdown', (e) => this.onDown(e));
      window.addEventListener('pointermove', (e) => this.onMove(e));
      window.addEventListener('pointerup', (e) => this.onUp(e));
      window.addEventListener('pointercancel', (e) => this.onUp(e));
    }

    getPointerPos(e) {
      const rect = this.canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    onDown(e) {
      if (currentTool === 'scroll') return;
      if (this.isDrawing) return;

      this.isDrawing = true;
      const pos = this.getPointerPos(e);
      this.lastPos = pos;

      let strokeColor = currentColor;
      let strokeSize = currentPenSize;
      let strokeAlpha = currentAlpha / 100;

      if (currentTool === 'highlighter') {
        strokeSize = Math.max(12, currentPenSize * 2.8);
        strokeAlpha = Math.min(0.35, currentAlpha / 100);
      } else if (currentTool === 'eraser') {
        this.eraseAt(pos.x, pos.y);
        return;
      }

      this.currentStroke = {
        tool: currentTool,
        color: strokeColor,
        size: strokeSize,
        alpha: strokeAlpha,
        baseW: this.displayWidth || 360,
        points: [pos]
      };

      this.ctx.save();
      this.ctx.beginPath();
      this.ctx.fillStyle = strokeColor;
      this.ctx.globalAlpha = strokeAlpha;
      this.ctx.arc(pos.x, pos.y, Math.max(1, strokeSize / 2), 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();
    }

    onMove(e) {
      if (!this.isDrawing) return;

      const pos = this.getPointerPos(e);

      if (currentTool === 'eraser') {
        this.eraseAt(pos.x, pos.y);
        return;
      }

      if (!this.currentStroke || !this.lastPos) return;

      this.ctx.save();
      this.ctx.beginPath();
      this.ctx.strokeStyle = this.currentStroke.color;
      this.ctx.globalAlpha = this.currentStroke.alpha;
      this.ctx.lineWidth = Math.max(0.8, this.currentStroke.size);
      this.ctx.lineCap = 'round';
      this.ctx.lineJoin = 'round';

      if (this.currentStroke.tool === 'highlighter') {
        this.ctx.globalCompositeOperation = 'multiply';
      }

      this.ctx.moveTo(this.lastPos.x, this.lastPos.y);
      this.ctx.lineTo(pos.x, pos.y);
      this.ctx.stroke();
      this.ctx.restore();

      this.currentStroke.points.push(pos);
      this.lastPos = pos;
    }

    onUp(e) {
      if (!this.isDrawing) return;
      this.isDrawing = false;
      this.lastPos = null;

      if (this.currentStroke && this.currentStroke.points.length > 0) {
        this.strokes.push(this.currentStroke);
        this.currentStroke = null;
        this.triggerDebouncedSave();
      }
    }

    triggerDebouncedSave() {
      if (this.id === 'canvas-week-review') {
        debouncedSaveWeekReview();
      } else if (this.id === 'canvas-month-review') {
        debouncedSaveMonthReview();
      } else {
        debouncedSaveCurrentDay();
      }
    }

    eraseAt(x, y) {
      const radius = 22;
      const currentWidth = this.displayWidth || 360;
      const origLen = this.strokes.length;

      this.strokes = this.strokes.filter(s => {
        const baseW = s.baseW || currentWidth;
        const scaleX = currentWidth / baseW;
        return !s.points.some(p => Math.hypot((p.x * scaleX) - x, p.y - y) < radius);
      });

      if (origLen !== this.strokes.length) {
        this.redrawFull();
        this.triggerDebouncedSave();
      }
    }

    undo() {
      if (this.strokes.length > 0) {
        this.strokes.pop();
        this.redrawFull();
        this.triggerDebouncedSave();
        showToast('마지막 획을 취소했습니다.');
      } else {
        showToast('취소할 필기 내용이 없습니다.');
      }
    }

    clear() {
      if (this.strokes.length === 0) return;
      this.strokes = [];
      this.redrawFull();
      this.triggerDebouncedSave();
    }

    redrawFull() {
      if (!this.canvas) return;
      const dpr = window.devicePixelRatio || 1;
      this.ctx.clearRect(0, 0, this.canvas.width / dpr, this.canvas.height / dpr);

      const currentWidth = this.displayWidth || 360;

      for (const s of this.strokes) {
        if (!s.points || s.points.length === 0) continue;
        const baseW = s.baseW || currentWidth;
        const scaleX = currentWidth / baseW;

        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.strokeStyle = s.color || '#1F2937';
        this.ctx.globalAlpha = s.alpha || 1;
        this.ctx.lineWidth = Math.max(0.8, s.size || 2);
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';

        if (s.tool === 'highlighter') {
          this.ctx.globalCompositeOperation = 'multiply';
        }

        if (s.points.length === 1) {
          this.ctx.arc(s.points[0].x * scaleX, s.points[0].y, Math.max(1, (s.size || 2) / 2), 0, Math.PI * 2);
          this.ctx.fillStyle = s.color || '#1F2937';
          this.ctx.fill();
        } else {
          this.ctx.moveTo(s.points[0].x * scaleX, s.points[0].y);
          for (let i = 1; i < s.points.length; i++) {
            this.ctx.lineTo(s.points[i].x * scaleX, s.points[i].y);
          }
          this.ctx.stroke();
        }
        this.ctx.restore();
      }
    }

    redraw() {
      this.redrawFull();
    }
  }

  const debouncedSaveCurrentDay = debounce(() => saveCurrentDayData(), 500);
  const debouncedSaveWeekReview = debounce(() => saveWeekReviewMeta(), 500);
  const debouncedSaveMonthReview = debounce(() => saveMonthSideMeta(), 500);

  function debounce(fn, delay) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), delay);
    };
  }

  function initApp() {
    loadLocalSettings();
    initPenToolbar();
    initCanvases();
    initDirectTools();
    initEventListeners();
    initBacklogDrawerEvents();
    initMonthSpread();
    loadRoutines();
    loadSchedules();
    loadBacklogs();
    initFirebaseIfAvailable();
    switchDate(currentDate);

    setTimeout(() => {
      Object.values(canvasControllers).forEach(c => {
        c.resizeCanvas();
        c.redrawFull();
      });
    }, 250);
  }

  function initCanvases() {
    const list = [
      'canvas-budget-feedback',
      'canvas-todo-feedback',
      'canvas-gratitude',
      'canvas-tome',
      'canvas-week-review',
      'canvas-month-review'
    ];
    list.forEach(id => {
      if (document.getElementById(id)) {
        canvasControllers[id] = new SmoothCanvas(id);
      }
    });

    window.addEventListener('resize', debounce(() => {
      Object.values(canvasControllers).forEach(c => {
        c.resizeCanvas();
        c.redrawFull();
      });
    }, 200));
  }

  function initPenToolbar() {
    const chipsContainer = document.getElementById('palette-chips-container');
    chipsContainer.innerHTML = '';
    PALETTE.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `palette-chip ${idx === 0 ? 'active' : ''}`;
      btn.style.backgroundColor = item.color;
      btn.title = item.name;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.palette-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        currentColor = item.color;
        document.getElementById('custom-color-picker').value = item.color;
        updatePenPreview();
      });
      chipsContainer.appendChild(btn);
    });

    document.querySelectorAll('.tool-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-mode-btn').forEach(b => {
          b.classList.remove('active', 'highlighter-active', 'capture-mode-active');
        });
        currentTool = btn.dataset.tool;

        if (currentTool === 'highlighter') {
          btn.classList.add('highlighter-active');
        } else if (currentTool === 'scroll') {
          btn.classList.add('capture-mode-active');
          showToast('📸 캡처/이동 모드: 화면 터치 스크롤 캡처 시 줄 그어짐이 방지됩니다.');
        } else {
          btn.classList.add('active');
        }

        Object.values(canvasControllers).forEach(c => {
          if (currentTool === 'scroll') {
            c.canvas.classList.remove('drawing-active');
            c.canvas.classList.add('scroll-active');
          } else {
            c.canvas.classList.remove('scroll-active');
            c.canvas.classList.add('drawing-active');
          }
        });
        updatePenPreview();
      });
    });

    document.getElementById('btn-toggle-options')?.addEventListener('click', (e) => {
      const p = document.getElementById('pen-options-panel');
      const isOpen = p.style.display !== 'none';
      p.style.display = isOpen ? 'none' : 'flex';
      e.currentTarget.classList.toggle('open', !isOpen);
      document.getElementById('toggle-arrow').textContent = isOpen ? '▼' : '▲';
    });

    const sizeSlider = document.getElementById('slider-pen-size');
    sizeSlider?.addEventListener('input', (e) => {
      currentPenSize = parseFloat(e.target.value);
      document.getElementById('label-size-val').textContent = `${currentPenSize.toFixed(1)} px`;
      updatePenPreview();
    });

    const alphaSlider = document.getElementById('slider-pen-alpha');
    alphaSlider?.addEventListener('input', (e) => {
      currentAlpha = parseInt(e.target.value, 10);
      document.getElementById('label-alpha-val').textContent = `${currentAlpha} %`;
      updatePenPreview();
    });

    document.getElementById('custom-color-picker')?.addEventListener('input', (e) => {
      currentColor = e.target.value;
      document.querySelectorAll('.palette-chip').forEach(c => c.classList.remove('active'));
      updatePenPreview();
    });

    document.querySelectorAll('#quick-size-chips .quick-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#quick-size-chips .quick-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentPenSize = parseFloat(chip.dataset.size);
        sizeSlider.value = currentPenSize;
        document.getElementById('label-size-val').textContent = `${currentPenSize.toFixed(1)} px`;
        updatePenPreview();
      });
    });

    document.querySelectorAll('#quick-alpha-chips .quick-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#quick-alpha-chips .quick-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentAlpha = parseInt(chip.dataset.alpha, 10);
        alphaSlider.value = currentAlpha;
        document.getElementById('label-alpha-val').textContent = `${currentAlpha} %`;
        updatePenPreview();
      });
    });
  }

  function updatePenPreview() {
    const dot = document.getElementById('preview-color-dot');
    const info = document.getElementById('preview-pen-info');
    if (dot) dot.style.backgroundColor = currentColor;
    if (info) {
      if (currentTool === 'scroll') {
        info.textContent = '이동/캡처';
      } else if (currentTool === 'eraser') {
        info.textContent = '지우개';
      } else {
        info.textContent = `${currentPenSize.toFixed(1)}px`;
      }
    }
  }

  function initDirectTools() {
    document.querySelectorAll('.btn-mode-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        const isType = btn.classList.contains('type-active');
        const nextMode = isType ? 'pen' : 'type';
        switchEditorMode(target, nextMode);

        if (target === 'week-review') {
          saveWeekReviewMeta();
        } else if (target === 'month-review') {
          saveMonthSideMeta();
        } else {
          saveCurrentDayData();
        }
      });
    });

    document.querySelectorAll('.undo-canvas').forEach(btn => {
      btn.addEventListener('click', () => {
        const cid = btn.dataset.canvas;
        canvasControllers[cid]?.undo();
      });
    });

    document.querySelectorAll('.clear-canvas').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cid = btn.dataset.canvas;
        const ok = await showConfirmDialog('손글씨 초기화', '이 칸의 손글씨를 모두 지우시겠습니까?', true);
        if (ok) {
          canvasControllers[cid]?.clear();
          showToast('손글씨가 초기화되었습니다.');
        }
      });
    });

    document.querySelectorAll('.btn-mini-resize').forEach(btn => {
      btn.addEventListener('click', () => {
        const cid = btn.dataset.canvas;
        const action = btn.dataset.action;
        const ctrl = canvasControllers[cid];
        if (!ctrl) return;

        const curH = ctrl.canvas.clientHeight;
        const step = 33;
        let nextH = curH;

        if (action === 'reset') {
          nextH = DEFAULT_CANVAS_HEIGHTS[cid] || 175;
          showToast('기본 높이로 복구되었습니다.');
        } else if (action === 'expand') {
          nextH = curH + step;
        } else if (action === 'shrink') {
          nextH = curH - step;
        }

        ctrl.setHeight(nextH);
        const txt = document.getElementById(cid.replace('canvas-', 'text-'));
        if (txt) txt.style.height = `${nextH}px`;

        if (cid === 'canvas-week-review') {
          saveWeekReviewMeta();
        } else if (cid === 'canvas-month-review') {
          saveMonthSideMeta();
        } else {
          saveCurrentDayData();
        }
      });
    });
  }

  function switchEditorMode(target, mode) {
    const wrapCanvas = document.getElementById(`wrap-canvas-${target}`);
    const textarea = document.getElementById(`text-${target}`);
    const btnMode = document.querySelector(`.btn-mode-toggle[data-target="${target}"]`);
    if (!wrapCanvas || !textarea) return;

    if (mode === 'type') {
      wrapCanvas.style.display = 'none';
      textarea.style.display = 'block';
      if (btnMode) {
        btnMode.textContent = '⌨️';
        btnMode.classList.add('type-active');
        btnMode.title = '타자 입력 모드 (터치 시 펜 모드로 전환)';
      }
      textarea.focus();
    } else {
      textarea.style.display = 'none';
      wrapCanvas.style.display = 'block';
      if (btnMode) {
        btnMode.textContent = '✎';
        btnMode.classList.remove('type-active');
        btnMode.title = '손글씨 펜 모드 (터치 시 타자 모드로 전환)';
      }
      setTimeout(() => {
        const ctrl = canvasControllers[`canvas-${target}`];
        if (ctrl) {
          ctrl.resizeCanvas();
          ctrl.redrawFull();
        }
      }, 50);
    }
  }

  function initEventListeners() {
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;

        document.querySelectorAll('.tab-content').forEach(c => {
          c.hidden = true;
          c.style.display = 'none';
        });
        const activeContent = document.getElementById(activeTab);
        if (activeContent) {
          activeContent.hidden = false;
          activeContent.style.display = 'block';
        }

        if (activeTab === 'tab-week') renderWeekArchive();
        if (activeTab === 'tab-month') renderMonthCalendar();
        
        setTimeout(() => {
          Object.values(canvasControllers).forEach(c => {
            c.resizeCanvas();
            c.redrawFull();
          });
        }, 80);
      });
    });

    document.getElementById('btn-prev-day')?.addEventListener('click', () => moveDay(-1));
    document.getElementById('btn-next-day')?.addEventListener('click', () => moveDay(1));
    document.getElementById('btn-goto-today')?.addEventListener('click', () => switchDate(getTodayStr()));

    document.getElementById('btn-add-budget-row')?.addEventListener('click', () => addLedgerEntry('budget'));
    document.getElementById('btn-add-spent-row')?.addEventListener('click', () => addLedgerEntry('spent'));

    ['text-budget-feedback', 'text-todo-feedback', 'text-gratitude', 'text-tome'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', debounce(() => {
        saveCurrentDayData();
      }, 500));
    });

    document.getElementById('text-week-review')?.addEventListener('input', debounce(saveWeekReviewMeta, 500));
    document.getElementById('text-month-review')?.addEventListener('input', debounce(saveMonthSideMeta, 500));

    document.getElementById('btn-tome-shuffle')?.addEventListener('click', () => {
      const q = TOME_PROMPTS[Math.floor(Math.random() * TOME_PROMPTS.length)];
      document.getElementById('tome-q-text').textContent = q;
      saveCurrentDayData();
    });

    document.getElementById('btn-open-routines')?.addEventListener('click', openRoutineModal);
    document.getElementById('btn-quick-manage-routines')?.addEventListener('click', openRoutineModal);
    document.getElementById('btn-close-routines')?.addEventListener('click', closeRoutineModal);
    document.getElementById('btn-save-routines')?.addEventListener('click', closeRoutineModal);
    document.getElementById('btn-add-routine')?.addEventListener('click', addRoutineItem);

    document.getElementById('btn-open-sync')?.addEventListener('click', openSyncModal);
    document.getElementById('btn-close-sync')?.addEventListener('click', closeSyncModal);
    document.getElementById('btn-save-sync')?.addEventListener('click', saveSyncSettings);
    document.getElementById('btn-force-pull-cloud')?.addEventListener('click', forcePullFromCloud);
    document.getElementById('btn-disconnect-sync')?.addEventListener('click', disconnectFirebase);
    document.getElementById('btn-export-backup')?.addEventListener('click', exportFullBackup);
    document.getElementById('input-import-backup')?.addEventListener('change', importBackupFile);

    const dockPanel = document.getElementById('timeblock-dock-panel');
    const toggleDockBtn = document.getElementById('btn-toggle-timeblock-dock');
    const closeDockBtn = document.getElementById('btn-close-dock');

    toggleDockBtn?.addEventListener('click', () => {
      const isShown = dockPanel.style.display !== 'none';
      dockPanel.style.display = isShown ? 'none' : 'flex';
      toggleDockBtn.textContent = isShown ? '+ 블록 추가' : '▲ 접기';
    });

    closeDockBtn?.addEventListener('click', () => {
      dockPanel.style.display = 'none';
      if (toggleDockBtn) toggleDockBtn.textContent = '+ 블록 추가';
    });

    const sInput = document.getElementById('input-block-start');
    const eInput = document.getElementById('input-block-end');
    const durBadge = document.getElementById('dock-duration-calc');

    const updateCalcBadge = () => {
      const dur = calculateDuration(sInput.value, eInput.value);
      durBadge.textContent = dur ? `(${dur} 몰입)` : '(시간 지정)';
    };

    sInput?.addEventListener('input', updateCalcBadge);
    eInput?.addEventListener('input', updateCalcBadge);

    document.getElementById('btn-add-daily-block')?.addEventListener('click', addDailyTimeBlock);

    document.getElementById('btn-month-prev')?.addEventListener('click', () => {
      currentMonthView.month--;
      if (currentMonthView.month < 1) {
        currentMonthView.month = 12;
        currentMonthView.year--;
      }
      renderMonthCalendar();
    });
    document.getElementById('btn-month-next')?.addEventListener('click', () => {
      currentMonthView.month++;
      if (currentMonthView.month > 12) {
        currentMonthView.month = 1;
        currentMonthView.year++;
      }
      renderMonthCalendar();
    });

    document.getElementById('btn-add-schedule')?.addEventListener('click', addMonthMilestone);

    ['month-focus-1', 'month-focus-2', 'month-focus-3', 'month-wishlist-memo'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', debounce(saveMonthSideMeta, 500));
    });
  }

  function moveDay(offset) {
    const [y, m, d] = currentDate.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    dateObj.setDate(dateObj.getDate() + offset);
    const ny = dateObj.getFullYear();
    const nm = String(dateObj.getMonth() + 1).padStart(2, '0');
    const nd = String(dateObj.getDate()).padStart(2, '0');
    switchDate(`${ny}-${nm}-${nd}`);
  }

  function switchDate(newDateStr) {
    currentDate = newDateStr;
    const isToday = currentDate === getTodayStr();

    document.getElementById('today-date-text').textContent = formatDisplayDate(currentDate);
    const badge = document.getElementById('date-status-badge');
    const gotoBtn = document.getElementById('btn-goto-today');

    if (badge) {
      if (isToday) {
        badge.className = 'date-status-badge badge-today';
        badge.textContent = '오늘';
        gotoBtn.style.display = 'none';
      } else {
        const todayD = new Date(getTodayStr());
        const curD = new Date(currentDate);
        if (curD > todayD) {
          badge.className = 'date-status-badge badge-tomorrow';
          badge.textContent = '내일 계획';
        } else {
          badge.className = 'date-status-badge badge-past';
          badge.textContent = '과거 기록';
        }
        gotoBtn.style.display = 'inline-flex';
      }
    }

    loadDayData(currentDate);
  }

  function getDayStorageKey(dateStr) {
    return `haru_day_${dateStr}`;
  }

  // 데이터 로드 핵심 함수: daysCache에 불러온 객체를 즉시 보존하도록 수정
  function loadDayData(dateStr) {
    let day = daysCache[dateStr];
    if (!day) {
      const local = localStorage.getItem(getDayStorageKey(dateStr));
      if (local) {
        try { day = JSON.parse(local); } catch (e) {}
      }
    }

    if (!day) {
      day = {
        budget: 0,
        spent: 0,
        budgetEntries: [{ id: 'b_init', title: '', amount: 0 }],
        spentEntries: [{ id: 's_init', title: '', amount: 0 }],
        routineChecks: {},
        calendarChecks: {},
        priorities: {},
        inputModes: {
          'budget-feedback': 'pen',
          'todo-feedback': 'pen',
          'gratitude': 'pen',
          'tome': 'pen'
        },
        texts: {},
        strokes: {},
        canvasHeights: {},
        tomePrompt: TOME_PROMPTS[0]
      };
    }

    if (!day.budgetEntries || day.budgetEntries.length === 0) {
      day.budgetEntries = [{ id: 'b_' + Date.now(), title: '', amount: 0 }];
    }
    if (!day.spentEntries || day.spentEntries.length === 0) {
      day.spentEntries = [{ id: 's_' + Date.now(), title: '', amount: 0 }];
    }

    // 전역 캐시에 할당하여 후속 저장 함수가 온전한 데이터를 참조하도록 보장
    daysCache[dateStr] = day;

    renderLedgerEntries(day);
    calcBudgetDiff();

    if (day.tomePrompt) {
      document.getElementById('tome-q-text').textContent = day.tomePrompt;
    }

    const sections = ['budget-feedback', 'todo-feedback', 'gratitude', 'tome'];
    sections.forEach(sec => {
      const mode = (day.inputModes && day.inputModes[sec]) || 'pen';
      switchEditorMode(sec, mode);

      const txtArea = document.getElementById(`text-${sec}`);
      if (txtArea) txtArea.value = (day.texts && day.texts[sec]) || '';

      const cid = `canvas-${sec}`;
      const ctrl = canvasControllers[cid];
      if (ctrl) {
        ctrl.strokes = (day.strokes && day.strokes[cid]) ? JSON.parse(JSON.stringify(day.strokes[cid])) : [];
        let loadedH = (day.canvasHeights && day.canvasHeights[cid]) || DEFAULT_CANVAS_HEIGHTS[cid] || 115;
        if (loadedH > MAX_SAFE_HEIGHT || loadedH < MIN_SAFE_HEIGHT) {
          loadedH = DEFAULT_CANVAS_HEIGHTS[cid] || 115;
        }
        ctrl.setHeight(loadedH);
        if (txtArea) txtArea.style.height = `${loadedH}px`;
        ctrl.redrawFull();
      }
    });

    renderDailyIntegratedSection(day);
  }

  function addLedgerEntry(type) {
    const day = daysCache[currentDate] || {};
    const key = type === 'budget' ? 'budgetEntries' : 'spentEntries';
    day[key] = day[key] || [];
    day[key].push({ id: `${type[0]}_${Date.now()}`, title: '', amount: 0 });
    daysCache[currentDate] = day;
    renderLedgerEntries(day);
    saveCurrentDayData();
  }

  function renderLedgerEntries(day) {
    const bContainer = document.getElementById('budget-entries-container');
    const sContainer = document.getElementById('spent-entries-container');
    if (!bContainer || !sContainer) return;

    bContainer.innerHTML = '';
    sContainer.innerHTML = '';

    const budgetEntries = day.budgetEntries || [];
    const spentEntries = day.spentEntries || [];

    budgetEntries.forEach(entry => {
      const row = createLedgerRow(entry, 'budget', budgetEntries.length > 1);
      bContainer.appendChild(row);
    });

    spentEntries.forEach(entry => {
      const row = createLedgerRow(entry, 'spent', spentEntries.length > 1);
      sContainer.appendChild(row);
    });

    updateLedgerTotals(day);
  }

  function createLedgerRow(entry, type, canDelete) {
    const row = document.createElement('div');
    row.className = 'ledger-row-pair';
    const placeTitle = type === 'budget' ? '지출 예정 (예: 외식)' : '지출 목록 (예: 탈취제)';

    row.innerHTML = `
      <input type="text" class="compact-input-text entry-title" value="${escapeHtml(entry.title || '')}" placeholder="${placeTitle}">
      <div class="compact-amount-box">
        <input type="number" class="compact-input-amount entry-amount" value="${entry.amount ? entry.amount : ''}" placeholder="0">
        <span class="compact-unit">원</span>
      </div>
      ${canDelete ? `<button type="button" class="btn-remove-line btn-del-row" title="항목 삭제">✕</button>` : `<span style="width:16px;"></span>`}
    `;

    const titleInp = row.querySelector('.entry-title');
    const amtInp = row.querySelector('.entry-amount');
    const delBtn = row.querySelector('.btn-del-row');

    titleInp.addEventListener('input', () => {
      entry.title = titleInp.value;
      debouncedSaveCurrentDay();
    });

    amtInp.addEventListener('input', () => {
      entry.amount = parseInt(amtInp.value, 10) || 0;
      updateLedgerTotals(daysCache[currentDate] || {});
      calcBudgetDiff();
      debouncedSaveCurrentDay();
    });

    if (delBtn) {
      delBtn.addEventListener('click', () => {
        const day = daysCache[currentDate] || {};
        const key = type === 'budget' ? 'budgetEntries' : 'spentEntries';
        day[key] = (day[key] || []).filter(e => e.id !== entry.id);
        daysCache[currentDate] = day;
        renderLedgerEntries(day);
        calcBudgetDiff();
        saveCurrentDayData();
      });
    }

    return row;
  }

  function updateLedgerTotals(day) {
    const totalBudget = (day.budgetEntries || []).reduce((sum, e) => sum + (e.amount || 0), 0);
    const totalSpent = (day.spentEntries || []).reduce((sum, e) => sum + (e.amount || 0), 0);

    day.budget = totalBudget;
    day.spent = totalSpent;

    const bEl = document.getElementById('budget-total-text');
    const sEl = document.getElementById('spent-total-text');
    if (bEl) bEl.textContent = `${totalBudget.toLocaleString()}원`;
    if (sEl) sEl.textContent = `${totalSpent.toLocaleString()}원`;
  }

  function calcBudgetDiff() {
    const curDay = daysCache[currentDate] || {};
    const badge = document.getElementById('budget-diff-badge');
    if (!badge) return;

    const b = curDay.budget || 0;
    const s = curDay.spent || 0;

    if (b === 0 && s === 0) {
      badge.style.display = 'none';
      badge.textContent = '';
      return;
    }

    badge.style.display = 'inline-block';
    const diff = b - s;
    if (diff >= 0) {
      badge.className = 'diff-badge diff-under';
      badge.textContent = `남음 +${diff.toLocaleString()}원`;
    } else {
      badge.className = 'diff-badge diff-over';
      badge.textContent = `초과 -${Math.abs(diff).toLocaleString()}원`;
    }
  }

  // 데이터 영구 저장 함수: 캐시 보존 및 로컬스토리지 예외 방어
  function saveCurrentDayData() {
    if (isRemoteApplying) return;

    const sections = ['budget-feedback', 'todo-feedback', 'gratitude', 'tome'];
    const strokes = {};
    const texts = {};
    const inputModes = {};
    const canvasHeights = {};

    sections.forEach(sec => {
      const cid = `canvas-${sec}`;
      const ctrl = canvasControllers[cid];
      if (ctrl) {
        strokes[cid] = ctrl.strokes;
        canvasHeights[cid] = Math.min(MAX_SAFE_HEIGHT, ctrl.canvas.clientHeight);
      }
      const txt = document.getElementById(`text-${sec}`);
      if (txt) texts[sec] = txt.value;

      const btnMode = document.querySelector(`.btn-mode-toggle[data-target="${sec}"]`);
      inputModes[sec] = btnMode && btnMode.classList.contains('type-active') ? 'type' : 'pen';
    });

    const routineChecks = {};
    document.querySelectorAll('#daily-routine-items input[type="checkbox"]').forEach(chk => {
      routineChecks[chk.dataset.rid] = chk.checked;
    });

    const calendarChecks = {};
    document.querySelectorAll('#daily-timeblock-items input[type="checkbox"]').forEach(chk => {
      calendarChecks[chk.dataset.sid] = chk.checked;
    });

    const currentDay = daysCache[currentDate] || {};
    const priorities = currentDay.priorities || {};
    const budgetEntries = currentDay.budgetEntries || [];
    const spentEntries = currentDay.spentEntries || [];

    const totalBudget = budgetEntries.reduce((sum, e) => sum + (e.amount || 0), 0);
    const totalSpent = spentEntries.reduce((sum, e) => sum + (e.amount || 0), 0);

    const dayData = {
      budget: totalBudget,
      spent: totalSpent,
      budgetEntries,
      spentEntries,
      budgetPlanText: budgetEntries.map(e => e.title).filter(Boolean).join(', '),
      spentItemText: spentEntries.map(e => e.title).filter(Boolean).join(', '),
      routineChecks,
      calendarChecks,
      priorities,
      inputModes,
      texts,
      strokes,
      canvasHeights,
      tomePrompt: document.getElementById('tome-q-text').textContent,
      updatedAt: Date.now(),
      senderId: CLIENT_ID
    };

    daysCache[currentDate] = dayData;

    try {
      localStorage.setItem(getDayStorageKey(currentDate), JSON.stringify(dayData));
    } catch (e) {
      console.warn('로컬스토리지 저장 용량 주의:', e);
    }

    updateDailySummaryBadge(dayData);
    renderPriorityFocusPills(dayData);

    if (isFirestoreOnline && firestoreDb) {
      syncDayToFirestore(currentDate, dayData);
    }
  }

  function renderDailyIntegratedSection(day) {
    day.priorities = day.priorities || {};

    const rContainer = document.getElementById('daily-routine-items');
    rContainer.innerHTML = '';
    routinesMaster.forEach(r => {
      const isDone = !!(day.routineChecks && day.routineChecks[r.id]);
      const isPri = !!(day.priorities[r.id]);
      const row = document.createElement('div');
      row.className = `check-item-row ${isDone ? 'done' : ''} ${isPri ? 'is-priority' : ''}`;
      row.innerHTML = `
        <button type="button" class="priority-star-btn ${isPri ? 'active' : ''}" data-itemid="${r.id}" title="최우선 루틴 지정">★</button>
        <input type="checkbox" class="custom-checkbox" data-rid="${r.id}" ${isDone ? 'checked' : ''}>
        <span class="check-text" style="flex:1;">${escapeHtml(r.text)}</span>
      `;

      row.querySelector('input').addEventListener('change', (e) => {
        row.classList.toggle('done', e.target.checked);
        saveCurrentDayData();
      });

      row.querySelector('.priority-star-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        day.priorities[r.id] = !day.priorities[r.id];
        renderDailyIntegratedSection(day);
        saveCurrentDayData();
      });

      rContainer.appendChild(row);
    });

    const tContainer = document.getElementById('daily-timeblock-items');
    tContainer.innerHTML = '';

    const rawDaySchedules = schedulesMaster.filter(s => s.date === currentDate);
    document.getElementById('daily-timeblock-count').textContent = `${rawDaySchedules.length}건`;

    if (rawDaySchedules.length === 0) {
      tContainer.innerHTML = '<div class="empty-hint-text">등록된 몰입 스케줄이 없습니다. 위의 [+ 블록 추가]로 계획해보세요.</div>';
    } else {
      const sortedSchedules = sortSchedulesByTime(rawDaySchedules);

      sortedSchedules.forEach(s => {
        const isDone = !!(day.calendarChecks && day.calendarChecks[s.id]);
        const isPri = !!(day.priorities[s.id]);
        const row = document.createElement('div');
        row.className = `check-item-row ${isDone ? 'done' : ''} ${isPri ? 'is-priority' : ''}`;
        
        const timeStr = formatScheduleTime(s);
        const durationStr = calculateDuration(s.time, s.endTime);
        const isMonthly = !!s.isMonthlyMilestone;

        row.innerHTML = `
          <button type="button" class="priority-star-btn ${isPri ? 'active' : ''}" data-itemid="${s.id}" title="최우선 몰입 과제">★</button>
          <input type="checkbox" class="custom-checkbox" data-sid="${s.id}" ${isDone ? 'checked' : ''}>
          <div class="timeblock-chip-group">
            <span class="time-chip">${timeStr}</span>
            ${durationStr ? `<span class="duration-pill">(${durationStr})</span>` : ''}
            ${isMonthly ? `<span class="source-tag">월간</span>` : ''}
          </div>
          <span class="check-text" style="flex:1; margin-left:3px;">${escapeHtml(s.text)}</span>
          <button type="button" class="routine-del-btn btn-del-sched" data-sid="${s.id}" title="삭제" style="font-size:12px; opacity:0.6;">✕</button>
        `;

        row.querySelector('input').addEventListener('change', (e) => {
          day.calendarChecks = day.calendarChecks || {};
          day.calendarChecks[s.id] = e.target.checked;
          row.classList.toggle('done', e.target.checked);
          saveCurrentDayData();
        });

        row.querySelector('.priority-star-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          day.priorities[s.id] = !day.priorities[s.id];
          renderDailyIntegratedSection(day);
          saveCurrentDayData();
        });

        row.querySelector('.btn-del-sched').addEventListener('click', async (e) => {
          e.stopPropagation();
          const ok = await showConfirmDialog('타임블록 삭제', `'${s.text}' 스케줄을 삭제하시겠습니까?`, true);
          if (ok) {
            schedulesMaster = schedulesMaster.filter(item => item.id !== s.id);
            saveSchedules();
          }
        });

        tContainer.appendChild(row);
      });
    }

    updateDailySummaryBadge(day);
    renderPriorityFocusPills(day);
  }

  function addDailyTimeBlock() {
    const sInput = document.getElementById('input-block-start');
    const eInput = document.getElementById('input-block-end');
    const titleInput = document.getElementById('input-block-title');

    const sVal = sInput.value;
    const eVal = eInput.value;
    const titleVal = titleInput.value.trim();

    if (!sVal || !eVal) {
      showToast('시작 시간과 종료 시간을 모두 지정해 주세요.');
      return;
    }
    if (!titleVal) {
      showToast('몰입할 스터디 과제나 주제를 입력해 주세요.');
      return;
    }

    schedulesMaster.push({
      id: 'tb_' + Date.now(),
      date: currentDate,
      time: sVal,
      endTime: eVal,
      text: titleVal,
      color: Math.floor(Math.random() * 5),
      isMonthlyMilestone: false
    });

    titleInput.value = '';
    saveSchedules();

    const dockPanel = document.getElementById('timeblock-dock-panel');
    const toggleDockBtn = document.getElementById('btn-toggle-timeblock-dock');
    if (dockPanel) dockPanel.style.display = 'none';
    if (toggleDockBtn) toggleDockBtn.textContent = '+ 블록 추가';

    showToast(`⏱️ ${sVal}~${eVal} 몰입 스케줄이 등록되었습니다!`);
  }

  function renderPriorityFocusPills(day) {
    const container = document.getElementById('priority-focus-container');
    if (!container) return;
    container.innerHTML = '';

    const priIds = Object.keys(day.priorities || {}).filter(k => day.priorities[k]);
    if (priIds.length === 0) {
      container.style.display = 'none';
      return;
    }

    container.style.display = 'flex';
    const label = document.createElement('span');
    label.style.fontSize = '11px';
    label.style.fontWeight = '700';
    label.style.color = '#92400E';
    label.style.marginRight = '4px';
    label.textContent = '⭐ 오늘의 최우선 집중:';
    container.appendChild(label);

    priIds.forEach(id => {
      let text = '';
      const r = routinesMaster.find(item => item.id === id);
      if (r) text = r.text;
      const s = schedulesMaster.find(item => item.id === id);
      if (s) text = s.text;

      if (text) {
        const pill = document.createElement('span');
        pill.className = 'focus-pill-item';
        pill.textContent = text;
        container.appendChild(pill);
      }
    });
  }

  function updateDailySummaryBadge(day) {
    const rTotal = routinesMaster.length;
    const rDone = Object.values(day.routineChecks || {}).filter(Boolean).length;
    const daySchedules = schedulesMaster.filter(s => s.date === currentDate);
    const sTotal = daySchedules.length;
    const sDone = Object.values(day.calendarChecks || {}).filter(Boolean).length;

    const total = rTotal + sTotal;
    const done = rDone + sDone;
    document.getElementById('auto-summary-badge').textContent = `달성 ${done} / ${total}`;
  }

  function loadRoutines() {
    const saved = localStorage.getItem('haru_routines');
    if (saved) {
      try { routinesMaster = JSON.parse(saved); } catch (e) {}
    }
  }

  function saveRoutines() {
    localStorage.setItem('haru_routines', JSON.stringify(routinesMaster));
    if (isFirestoreOnline && firestoreDb) {
      const roomKey = getRoomKey();
      if (roomKey) {
        firestoreDb.collection('haru_diaries').doc(roomKey).collection('meta').doc('routines').set({
          list: routinesMaster,
          updatedAt: Date.now(),
          senderId: CLIENT_ID
        }, { merge: true });
      }
    }
    renderDailyIntegratedSection(daysCache[currentDate] || {});

  function renderMonthCalendar() {
    const { year, month } = currentMonthView;
    const monthNamesEn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    document.getElementById('month-title-en').textContent = `${monthNamesEn[month - 1]} ${year}`;
    document.getElementById('month-title-text').textContent = `${year}년 ${month}월의 기록`;

    loadMonthSideMeta();

    const grid = document.getElementById('month-calendar-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const firstDay = new Date(year, month - 1, 1).getDay();
    const lastDate = new Date(year, month, 0).getDate();
    const prevLastDate = new Date(year, month - 1, 0).getDate();

    let cellCount = 0;

    for (let i = firstDay - 1; i >= 0; i--) {
      const d = prevLastDate - i;
      grid.appendChild(createDayCell(d, true, false, false, ''));
      cellCount++;
    }

    let monthSpentTotal = 0;
    let completedDays = 0;
    const todayStr = getTodayStr();

    for (let d = 1; d <= lastDate; d++) {
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = dateStr === todayStr;
      const dow = (cellCount % 7);
      const isSun = dow === 0;
      const isSat = dow === 6;

      const dayData = daysCache[dateStr] || getLocalDayData(dateStr);
      if (dayData) {
        monthSpentTotal += (dayData.spent || 0);
        const rDone = Object.values(dayData.routineChecks || {}).filter(Boolean).length;
        if (rDone > 0) completedDays++;
      }

      grid.appendChild(createDayCell(d, false, isSun, isSat, dateStr, isToday, dayData));
      cellCount++;
    }

    const remain = (7 - (cellCount % 7)) % 7;
    for (let i = 1; i <= remain; i++) {
      grid.appendChild(createDayCell(i, true, false, false, ''));
      cellCount++;
    }

    document.getElementById('month-spent-total').textContent = `${monthSpentTotal.toLocaleString()}원`;
    document.getElementById('month-todo-days').textContent = `${completedDays}일`;
    const rate = lastDate > 0 ? Math.round((completedDays / lastDate) * 100) : 0;
    document.getElementById('month-avg-rate').textContent = `${rate}%`;
  }

  function getLocalDayData(dateStr) {

  function createDayCell(dayNum, isOtherMonth, isSun, isSat, dateStr, isToday = false, dayData = null) {
    const cell = document.createElement('div');
    cell.className = `diary-day-cell ${isOtherMonth ? 'other-month' : ''} ${isSun ? 'sun' : ''} ${isSat ? 'sat' : ''} ${isToday ? 'is-today' : ''}`;

    const topRow = document.createElement('div');
    topRow.className = 'day-top-row';

    const numSpan = document.createElement('span');
    numSpan.className = 'day-num';
    numSpan.textContent = dayNum;
    topRow.appendChild(numSpan);

    const badgesWrap = document.createElement('div');
    badgesWrap.className = 'day-badges-wrap';

    if (!isOtherMonth && dayData) {
      if (dayData.spent === 0 && (dayData.budget > 0)) {
        const noSpend = document.createElement('span');
        noSpend.className = 'no-spend-badge';
        noSpend.textContent = '☕ 無지출';
        badgesWrap.appendChild(noSpend);
      }

      const rTotal = routinesMaster.length;
      const rDone = Object.values(dayData.routineChecks || {}).filter(Boolean).length;
      if (rTotal > 0 && rDone >= rTotal) {
        const stamp = document.createElement('span');
        stamp.className = 'stamp-done';
        stamp.textContent = 'DONE';
        badgesWrap.appendChild(stamp);
      }
    }
    topRow.appendChild(badgesWrap);
    cell.appendChild(topRow);

    if (!isOtherMonth && dateStr) {
      const tapeList = document.createElement('div');
      tapeList.className = 'tape-schedule-list';

      const monthlyMilestones = sortSchedulesByTime(
        schedulesMaster.filter(s => s.date === dateStr && (s.isMonthlyMilestone !== false))
      );

      monthlyMilestones.slice(0, 3).forEach(s => {
        const item = document.createElement('div');
        item.className = `washi-tape-item tape-color-${s.color || 0}`;
        item.textContent = s.text;
        item.title = `${formatScheduleTime(s)} ${s.text}`;
        tapeList.appendChild(item);
      });

      if (monthlyMilestones.length > 3) {
        const more = document.createElement('div');
        more.className = 'tape-more-hint';
        more.textContent = `+${monthlyMilestones.length - 3}건`;
        tapeList.appendChild(more);
      }
      cell.appendChild(tapeList);

      cell.addEventListener('click', () => {
        switchDate(dateStr);
        document.querySelector('.nav-tab[data-tab="tab-today"]')?.click();
      });
    }

    return cell;
  }

  function renderWeekArchive() {
    const [y, m, d] = currentDate.split('-').map(Number);
    const cur = new Date(y, m - 1, d);
    const dayDow = cur.getDay();

    const start = new Date(cur);
    start.setDate(cur.getDate() - dayDow);

    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    document.getElementById('week-date-range-text').textContent =
      `${start.getFullYear()}.${start.getMonth() + 1}.${start.getDate()} ~ ${end.getFullYear()}.${end.getMonth() + 1}.${end.getDate()}`;

    loadWeekReviewMeta(getWeekKey(currentDate));

    const container = document.getElementById('week-archive-list');
    container.innerHTML = '';

    let totalTodos = 0;
    let doneTodos = 0;
    let feedbackDays = 0;
    const dows = ['일', '월', '화', '수', '목', '금', '토'];

    for (let i = 0; i < 7; i++) {
      const targetD = new Date(start);
      targetD.setDate(start.getDate() + i);
      const ds = `${targetD.getFullYear()}-${String(targetD.getMonth() + 1).padStart(2, '0')}-${String(targetD.getDate()).padStart(2, '0')}`;
      const dayData = daysCache[ds] || getLocalDayData(ds);

      const col = document.createElement('div');
      col.className = `day-archive-col ${ds === getTodayStr() ? 'is-today' : ''}`;

      let rateText = '0%';
      let todoCnt = '0/0';
      let feedbackHtml = '<span style="color:var(--ink-faint); font-style:italic;">(피드백 없음)</span>';

      if (dayData) {
        const rTotal = routinesMaster.length;
        const rDone = Object.values(dayData.routineChecks || {}).filter(Boolean).length;
        const dayS = schedulesMaster.filter(s => s.date === ds);
        const sTotal = dayS.length;
        const sDone = Object.values(dayData.calendarChecks || {}).filter(Boolean).length;

        const allTotal = rTotal + sTotal;
        const allDone = rDone + sDone;

        totalTodos += allTotal;
        doneTodos += allDone;
        if (allTotal > 0) rateText = `${Math.round((allDone / allTotal) * 100)}%`;
        todoCnt = `${allDone}/${allTotal}`;

        const textFb = dayData.texts && dayData.texts['todo-feedback'] ? dayData.texts['todo-feedback'].trim() : '';
        const hasStrokes = dayData.strokes && dayData.strokes['canvas-todo-feedback'] && dayData.strokes['canvas-todo-feedback'].length > 0;

        if (textFb) {
          feedbackDays++;
          feedbackHtml = escapeHtml(textFb);
        } else if (hasStrokes) {
          feedbackDays++;
          feedbackHtml = `<span style="font-size:10.5px; background:#FFF7ED; border:1px solid #FDE68A; color:var(--accent); padding:2px 6px; border-radius:4px; font-weight:700;">✍️ 손글씨 피드백 작성됨</span>`;
        }
      }

      col.innerHTML = `
        <div class="day-col-title">
          <span>${targetD.getMonth() + 1}/${targetD.getDate()} (${dows[i]})</span>
          <span style="color:var(--accent); font-family:var(--font-mono); font-size:11px;">${rateText}</span>
        </div>
        <div style="font-size:11px; color:var(--ink-soft); font-family:var(--font-mono);">완료: ${todoCnt}</div>
        <div style="font-size:11px; color:var(--ink-soft); white-space:pre-wrap; max-height:80px; overflow-y:auto; border-top:1px dashed var(--line); padding-top:4px;">
          ${feedbackHtml}
        </div>
      `;

      col.addEventListener('click', () => {
        switchDate(ds);
        document.querySelector('.nav-tab[data-tab="tab-today"]')?.click();
      });
      container.appendChild(col);
    }

    const overallRate = totalTodos > 0 ? Math.round((doneTodos / totalTodos) * 100) : 0;
    document.getElementById('week-todo-rate').textContent = `${overallRate}%`;
    document.getElementById('week-todo-count').textContent = `${doneTodos} / ${totalTodos}`;
    document.getElementById('week-feedback-days').textContent = `${feedbackDays} / 7일`;
  }

    const config = localStorage.getItem('haru_firebase_config') || '';
    if (document.getElementById('input-secret-key')) document.getElementById('input-secret-key').value = key;
    if (document.getElementById('input-firebase-config')) document.getElementById('input-firebase-config').value = config;
  }

  function openSyncModal() {
    loadLocalSettings();
    document.getElementById('sync-modal').style.display = 'flex';
  }

  function closeSyncModal() {
    document.getElementById('sync-modal').style.display = 'none';
  }

  function updateSyncStatusUI(status, text) {
    const dot = document.getElementById('sync-dot');
    const txt = document.getElementById('sync-text');
    const modalBadge = document.getElementById('modal-sync-status-badge');

    if (dot) dot.className = `sync-dot ${status}`;
    if (txt) txt.textContent = text;
    if (modalBadge) {
      modalBadge.textContent = text;
      modalBadge.style.color = status === 'online' ? '#10B981' : status === 'syncing' ? '#F59E0B' : status === 'error' ? '#EF4444' : 'var(--ink-soft)';
    }
  }

  function saveSyncSettings() {
    const rawKey = document.getElementById('input-secret-key').value.trim();
    const configStr = document.getElementById('input-firebase-config').value.trim();

    if (!rawKey || !configStr) {
      showToast('비밀 코드와 Firebase 설정값 JSON을 모두 입력해 주세요.');
      return;
    }

    const key = rawKey.toLowerCase();
    localStorage.setItem('haru_room_key', key);
    localStorage.setItem('haru_firebase_config', configStr);

    closeSyncModal();
    initFirebaseIfAvailable();
    showToast('동기화 정보가 저장되었습니다. 클라우드 연결을 시작합니다.');
  }

  async function disconnectFirebase() {
    const ok = await showConfirmDialog('Firebase 연결 해제', 'Firebase 동기화 연결을 해제하시겠습니까? (로컬 데이터는 그대로 보존됩니다)', true);
    if (!ok) return;

    if (unsubscribeFirestore) unsubscribeFirestore();
    localStorage.removeItem('haru_room_key');
    localStorage.removeItem('haru_firebase_config');
    isFirestoreOnline = false;
    firestoreDb = null;
    updateSyncStatusUI('', '로컬 보관');
    closeSyncModal();
    showToast('클라우드 연결이 해제되었습니다.');
  }

  function initFirebaseIfAvailable() {
    const roomKey = getRoomKey();
    const configStr = localStorage.getItem('haru_firebase_config');

    if (!roomKey || !configStr) {
      updateSyncStatusUI('', '로컬 보관');
      return;
    }

    if (typeof firebase === 'undefined') {
      updateSyncStatusUI('error', 'SDK 로드 대기');
      return;
    }

    try {
      const config = JSON.parse(configStr);
      if (!firebase.apps.length) {
        firebase.initializeApp(config);
      }
      firestoreDb = firebase.firestore();
      isFirestoreOnline = true;
      updateSyncStatusUI('online', '실시간 연동 중');
      listenToRoomChanges(roomKey);
      listenToMetaChanges(roomKey);
    } catch (e) {
      console.error(e);
      isFirestoreOnline = false;
      updateSyncStatusUI('error', '연결 오류');
    }
  }

  function listenToRoomChanges(roomKey) {
    if (unsubscribeFirestore) unsubscribeFirestore();

    const daysCol = firestoreDb.collection('haru_diaries').doc(roomKey).collection('days');
    unsubscribeFirestore = daysCol.onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        const data = change.doc.data();
        const dateKey = change.doc.id;
        if (!data || data.senderId === CLIENT_ID) return;

        daysCache[dateKey] = data;
        localStorage.setItem(getDayStorageKey(dateKey), JSON.stringify(data));

        if (dateKey === currentDate) {
          isRemoteApplying = true;
          loadDayData(currentDate);
          isRemoteApplying = false;
        }
      });
    }, err => {
      console.error(err);
      updateSyncStatusUI('error', '수신 오류');
    });
  }

  function listenToMetaChanges(roomKey) {
    const metaCol = firestoreDb.collection('haru_diaries').doc(roomKey).collection('meta');
    metaCol.onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        const docId = change.doc.id;
        const data = change.doc.data();
        if (!data || data.senderId === CLIENT_ID) return;

        if (docId === 'routines' && data.list) {
          routinesMaster = data.list;
          localStorage.setItem('haru_routines', JSON.stringify(routinesMaster));
          renderDailyIntegratedSection(daysCache[currentDate] || {});
        } else if (docId === 'schedules' && data.list) {
          schedulesMaster = data.list;
          localStorage.setItem('haru_schedules', JSON.stringify(schedulesMaster));
          renderDailyIntegratedSection(daysCache[currentDate] || {});
          renderMonthCalendar();
        } else if (docId === 'backlogs' && data.list) {
          backlogsMaster = data.list;
          localStorage.setItem('haru_backlogs', JSON.stringify(backlogsMaster));
          updateBacklogCounters();
          renderDrawerList();
        }
      });
    });
  }

  function syncDayToFirestore(dateStr, data) {
    const roomKey = getRoomKey();
    if (!roomKey || !firestoreDb) return;

    updateSyncStatusUI('syncing', '클라우드 저장 중');
    const cleanData = sanitizeForFirestore(data);

    firestoreDb.collection('haru_diaries')
      .doc(roomKey)
      .collection('days')
      .doc(dateStr)
      .set(cleanData, { merge: true })
      .then(() => {
        updateSyncStatusUI('online', '실시간 연동 중');
      })
      .catch(err => {
        console.error(err);
        updateSyncStatusUI('error', '저장 오류');
      });
  }

  async function forcePullFromCloud() {
    const roomKey = getRoomKey();
    if (!roomKey || !firestoreDb) {
      showToast('Firebase 연결 설정을 먼저 완료해 주세요.');
      return;
    }
    try {
      updateSyncStatusUI('syncing', '데이터 가져오는 중');
      const snap = await firestoreDb.collection('haru_diaries').doc(roomKey).collection('days').get();
      snap.forEach(doc => {
        const d = doc.data();
        daysCache[doc.id] = d;
        localStorage.setItem(getDayStorageKey(doc.id), JSON.stringify(d));
      });
      loadDayData(currentDate);
      updateSyncStatusUI('online', '실시간 연동 중');
      showToast('클라우드에서 최신 데이터를 모두 불러왔습니다!');
    } catch (e) {
      console.error(e);
      showToast('데이터 가져오기 실패: ' + e.message);
      updateSyncStatusUI('error', '오류 발생');
    }
  }

  function exportFullBackup() {
    const backup = {
      exportTime: new Date().toISOString(),
      roomKey: getRoomKey(),
      routines: routinesMaster,
      schedules: schedulesMaster,
      backlogs: backlogsMaster,
      days: {}
    };

    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('haru_day_')) {
        try {
          backup.days[k.replace('haru_day_', '')] = JSON.parse(localStorage.getItem(k));
        } catch (e) {}
      }
    }

    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `하루의페이지_전체백업_${getTodayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('백업 파일이 안전하게 다운로드되었습니다.');
  }

  function importBackupFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.routines) {
          routinesMaster = data.routines;
          localStorage.setItem('haru_routines', JSON.stringify(routinesMaster));
        }
        if (data.schedules) {
          schedulesMaster = data.schedules;
          localStorage.setItem('haru_schedules', JSON.stringify(schedulesMaster));
        }
        if (data.backlogs) {
          backlogsMaster = data.backlogs;
          localStorage.setItem('haru_backlogs', JSON.stringify(backlogsMaster));
        }
        if (data.days) {
          Object.keys(data.days).forEach(dateKey => {
            const dayObj = data.days[dateKey];
            daysCache[dateKey] = dayObj;
            localStorage.setItem(getDayStorageKey(dateKey), JSON.stringify(dayObj));
          });
        }
        updateBacklogCounters();
        loadDayData(currentDate);
        showToast('백업 데이터를 성공적으로 복원했습니다!');
        closeSyncModal();
      } catch (err) {
        showToast('올바르지 않은 백업 JSON 파일입니다.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag));
  }

  document.addEventListener('DOMContentLoaded', initApp);
})();
</script>
